<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect GitHub + Manus</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #171731 0%, #090912 55%, #040408 100%);
            color: #e9ecff;
            padding: 20px;
        }

        .card {
            width: min(680px, 100%);
            background: rgba(12, 13, 27, 0.92);
            border: 1px solid rgba(88, 125, 255, 0.35);
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 1.9rem;
            color: #95beff;
        }

        p {
            margin: 0 0 18px;
            line-height: 1.5;
            color: #b8c7f5;
        }

        .services {
            display: grid;
            gap: 12px;
            margin: 20px 0;
        }

        .service {
            border: 1px solid rgba(88, 125, 255, 0.3);
            border-radius: 10px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(88, 125, 255, 0.08);
        }

        .service strong {
            display: block;
            margin-bottom: 4px;
            color: #f2f5ff;
        }

        .service span {
            font-size: 0.9rem;
            color: #9cb2f0;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #72b0ff, #3f74ff);
            color: #061133;
        }

        button:hover {
            filter: brightness(1.06);
        }

        #approve-btn {
            margin-top: 8px;
            width: 100%;
            padding: 13px 16px;
            font-size: 1rem;
        }

        #approve-btn:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .status {
            margin-top: 14px;
            min-height: 26px;
            font-weight: 600;
            color: #8ce0a0;
        }

        .muted {
            color: #93a2cc;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Connect GitHub and Manus</h1>
        <p>Use this screen to start both sign-ins, then approve once both services return as connected.</p>

        <section class="services" aria-label="Connection services">
            <article class="service">
                <div>
                    <strong>GitHub</strong>
                    <span id="github-state">Not connected</span>
                </div>
                <button type="button" id="connect-github">Connect</button>
            </article>

            <article class="service">
                <div>
                    <strong>Manus</strong>
                    <span id="manus-state">Not connected</span>
                </div>
                <button type="button" id="connect-manus">Connect</button>
            </article>
        </section>

        <button type="button" id="approve-btn" disabled>Approve Connection</button>
        <p class="status" id="status">Connect both services to continue.</p>
        <p class="muted">Set your OAuth URLs in the script config before production use.</p>
    </main>

    <script>
        (function () {
            var CONFIG = {
                githubConnectUrl: '',
                manusConnectUrl: '',
                statusUrl: '',
                approveUrl: ''
            };

            var githubConnected = false;
            var manusConnected = false;

            var githubState = document.getElementById('github-state');
            var manusState = document.getElementById('manus-state');
            var status = document.getElementById('status');
            var approveBtn = document.getElementById('approve-btn');
            var githubBtn = document.getElementById('connect-github');
            var manusBtn = document.getElementById('connect-manus');

            function updateView() {
                githubState.textContent = githubConnected ? 'Connected' : 'Not connected';
                manusState.textContent = manusConnected ? 'Connected' : 'Not connected';
                approveBtn.disabled = !(githubConnected && manusConnected);

                if (githubConnected && manusConnected) {
                    status.textContent = 'Both connected. Press "Approve Connection".';
                } else {
                    status.textContent = 'Connect both services to continue.';
                }
            }

            function startConnection(url, serviceName) {
                if (!url) {
                    status.textContent = serviceName + ' OAuth URL is not configured yet.';
                    return;
                }
                window.location.href = url;
            }

            function validateConfig() {
                if (!CONFIG.githubConnectUrl || !CONFIG.manusConnectUrl || !CONFIG.statusUrl || !CONFIG.approveUrl) {
                    status.textContent = 'Configure OAuth and status endpoints before using this page.';
                }
            }

            function refreshConnectionState() {
                if (!CONFIG.statusUrl) {
                    return;
                }

                fetch(CONFIG.statusUrl, { credentials: 'include' })
                    .then(function (response) { return response.json(); })
                    .then(function (data) {
                        githubConnected = data.githubConnected === true;
                        manusConnected = data.manusConnected === true;
                        updateView();
                    })
                    .catch(function () {
                        status.textContent = 'Could not load current connection state.';
                        updateView();
                    });
            }

            githubBtn.addEventListener('click', function () {
                startConnection(CONFIG.githubConnectUrl, 'GitHub');
            });

            manusBtn.addEventListener('click', function () {
                startConnection(CONFIG.manusConnectUrl, 'Manus');
            });

            approveBtn.addEventListener('click', function () {
                if (!CONFIG.approveUrl) {
                    status.textContent = 'Approve URL is not configured yet.';
                    return;
                }
                window.location.href = CONFIG.approveUrl;
            });

            validateConfig();
            refreshConnectionState();
        }());
    </script>
</body>
</html>
