name: List product on Explodely

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: Path to the Explodely product config JSON file
        required: false
        default: explodely-product.json
        type: string
      mode:
        description: Preview fills the form without submitting; publish submits the product
        required: true
        default: preview
        type: choice
        options:
          - preview
          - publish
  issue_comment:
    types:
      - created

permissions:
  contents: read

jobs:
  list-product:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.actor == github.repository_owner &&
       contains(github.event.comment.body, 'list it'))
    runs-on: ubuntu-latest
    env:
      EXPLODELY_PRODUCT_CONFIG: ${{ github.event.inputs.config_path || 'explodely-product.json' }}
      EXPLODELY_USERNAME: ${{ secrets.EXPLODELY_USERNAME }}
      EXPLODELY_PASSWORD: ${{ secrets.EXPLODELY_PASSWORD }}
      EXPLODELY_BASE_URL: ${{ secrets.EXPLODELY_BASE_URL }}
      EXPLODELY_SKIP_SUBMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'publish' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate product config
        run: npm run validate-product

      - name: Publish or preview Explodely listing
        run: npm run list-explodely

      - name: Upload automation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explodely-automation-artifacts
          path: artifacts/
          if-no-files-found: ignore
